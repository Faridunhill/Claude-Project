# ═══════════════════════════════════════════════════════════════════
# BRAND ALLOWLIST — the only names the catalog adapter may read out of
# a listing title and assert as `brand`.
#
# WHY AN ALLOWLIST: the adapter must never guess a maker from a stray
# word. A title says "Vintage German Leather Cigar Case" — "German" is
# not a brand. Only names on this list are extracted, and only when the
# whole phrase appears in the title Farid wrote himself. That makes the
# claim human-sourced (FieldSource.HUMAN), which is what lets the copy
# generators ASSERT it instead of hedging.
#
# TO ADD A BRAND: add the line. Longest match wins, so put multi-word
# names in freely ("Butz-Choquin" beats "Butz"). Matching is
# case-insensitive and ignores punctuation differences.
#
# TO REMOVE A CLAIM: delete the line. The next run regenerates every
# caption without it — nothing is hand-edited, ever.
# ═══════════════════════════════════════════════════════════════════
