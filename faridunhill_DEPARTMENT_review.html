sories", "Lighters & Matches", "Sale & Clearance"];
DATA.forEach((d,i)=>{d.orig=d.cat;d.id=i});

function esc(s){return s.replace(/'/g,"''")}
function setCat(i,v){DATA[i].cat=v;render()}
function render(){
 const q=document.getElementById('search').value.toLowerCase();
 const f=document.getElementById('filter').value;
 const oc=document.getElementById('onlychg').checked;
 const list=document.getElementById('list');list.innerHTML='';
 let changed=0;DATA.forEach(d=>{if(d.cat!==d.orig)changed++});
 let shown=0;
 DATA.forEach(d=>{
  if(q&&!d.name.toLowerCase().includes(q))return;
  if(f&&d.cat!==f)return;
  if(oc&&d.cat===d.orig)return;
  shown++;
  const row=document.createElement('div');row.className='row'+(d.cat!==d.orig?' changed':'');
  const opts=DEPTS.map(x=>`<option ${x===d.cat?'selected':''}>${x}</option>`).join('');
  row.innerHTML=`<img class="thumb" src="${d.img}" onerror="this.style.opacity=.2">
   <div><div class="nm">${d.name}</div><div class="qty">${d.count>1?('x'+d.count+' units'):''}</div></div>
   <div class="pr">$${d.price.toFixed(2)}</div>
   <div><select class="dept" onchange="setCat(${d.id},this.value)">${opts}</select></div>`;
  list.appendChild(row);
 });
 document.getElementById('tot').textContent=shown;
 document.getElementById('chg').textContent=changed;
}
function genSQL(){
 let s='-- Faridunhill department map (reviewed by Farid)\nBEGIN;\n';
 DATA.forEach(d=>{s+=`UPDATE public.products SET category='${esc(d.cat)}' WHERE name='${esc(d.name)}';\n`});
 s+='COMMIT;';
 const o=document.getElementById('out');o.classList.remove('hide');o.value=s;o.scrollIntoView({behavior:'smooth'});
}
function copySQL(){const o=document.getElementById('out');if(o.classList.contains('hide'))genSQL();o.select();document.execCommand('copy');alert('SQL copied. Paste into Supabase SQL editor and RUN.')}
